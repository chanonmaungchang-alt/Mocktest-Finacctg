<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mock Midterm — Financial Accounting 2601115</title>
<style>
:root{
  --navy:#0c2544; --navy2:#123a66; --gold:#8a5a00; --cream:#eef1f5;
  --ink:#0a0d12; --sub:#3d4451; --green:#155c34; --red:#8f2620; --line:#8b93a3;
  --cardbg:#ffffff; --optbg:#f2f4f8;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--cream); color:var(--ink);
  font-family: "Noto Sans Thai","Sarabun",system-ui,-apple-system,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  line-height:1.55;
}
.top{
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:#f2ede0; padding:22px 18px 18px; position:relative;
  padding-top:calc(22px + env(safe-area-inset-top,0px));
}
.top h1{margin:0 0 4px; font-size:1.25rem; font-weight:700; letter-spacing:.2px;}
.top p{margin:0; color:#cdd8e6; font-size:.85rem;}
.top .code{color:var(--gold); font-weight:600;}
.wrap{max-width:720px; margin:0 auto; padding:16px;}
.progressbar{height:8px; background:rgba(255,255,255,.18); border-radius:6px; margin-top:14px; overflow:hidden;}
.progressfill{height:100%; background:var(--gold); width:0%; transition:width .25s ease;}
.scorepill{
  display:flex; justify-content:space-between; align-items:center;
  background:var(--cardbg); border:1.5px solid var(--line); border-radius:10px;
  padding:10px 14px; margin:14px 0; font-size:.85rem; color:var(--sub);
  position:sticky; top:calc(8px + env(safe-area-inset-top,0px)); z-index:5;
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.scorepill b{color:var(--navy2); font-size:1rem;}
:root[data-theme="dark"] .scorepill b, :root:not([data-theme="light"]) .scorepill b{color:var(--gold);}
.qcard{
  background:var(--cardbg); border:1.5px solid var(--line); border-radius:12px;
  padding:16px 16px 14px; margin-bottom:14px; box-shadow:0 1px 6px rgba(0,0,0,.06);
}
.qmeta{display:flex; gap:8px; align-items:center; margin-bottom:8px; flex-wrap:wrap;}
.tag{font-size:.68rem; background:var(--navy); color:#fff; padding:3px 9px; border-radius:20px;}
.tag.gold{background:var(--gold); color:#2a2005;}
.qnum{font-weight:700; color:var(--sub); font-size:.8rem;}
.qtext{white-space:pre-line; font-size:.97rem; margin:6px 0 12px;}
.opt{
  display:block; width:100%; text-align:left; padding:11px 12px;
  border:1.5px solid var(--line); border-radius:9px; background:var(--optbg);
  color:var(--ink); font-size:.92rem; font-weight:500; margin-bottom:8px; cursor:pointer;
  font-family:inherit; transition:border-color .15s, background .15s;
}
.opt:hover{border-color:var(--navy2); background:rgba(23,59,99,.08);}
.opt.correct{border-color:var(--green); background:rgba(46,125,79,.1); font-weight:600;}
.opt.wrong{border-color:var(--red); background:rgba(179,65,58,.1);}
.opt.disabled{cursor:default;}
.opt.faded{opacity:.55;}
.explain{
  margin-top:10px; padding:11px 13px; border-radius:9px; font-size:.87rem;
  background:rgba(201,164,76,.13); border-left:4px solid var(--gold); display:none;
}
.explain.show{display:block;}
.explain b{color:var(--navy2);}
:root[data-theme="dark"] .explain b, :root:not([data-theme="light"]) .explain b{color:var(--gold);}
.result-badge{font-size:.8rem; font-weight:700; margin-top:2px;}
.result-badge.ok{color:var(--green);}
.result-badge.no{color:var(--red);}
.finalbox{
  text-align:center; background:var(--cardbg); border:1.5px solid var(--line);
  border-radius:14px; padding:26px 18px; margin-top:10px;
}
.finalbox .big{font-size:2.4rem; font-weight:800; color:var(--navy2);}
:root[data-theme="dark"] .finalbox .big, :root:not([data-theme="light"]) .finalbox .big{color:var(--gold);}
.finalbox p{color:var(--sub);}
button.act{
  background:var(--navy); color:#fff; border:none; border-radius:9px;
  padding:11px 20px; font-size:.9rem; font-weight:600; cursor:pointer; margin-top:10px;
}
.overflow{overflow-x:auto;}
table.tacc{border-collapse:collapse; width:100%; font-size:.85rem; margin:6px 0;}
table.tacc th, table.tacc td{border:1px solid var(--line); padding:5px 8px; text-align:right;}
table.tacc th{background:rgba(15,42,74,.06); text-align:center;}
table.tacc td:first-child, table.tacc th:first-child{text-align:left;}
.footer{text-align:center; color:var(--sub); font-size:.78rem; padding:20px 0 30px;}
</style>
</head>
<body>
<div class="top">
  <h1>Mock Midterm Exam</h1>
  <p><span class="code">2601115 Financial Accounting</span> — จำลองสถานการณ์ธุรกิจ 45 ข้อ ครอบคลุม GJ, GL, การปิดบัญชี, รายการปรับปรุง, ค่าเผื่อหนี้สงสัยจะสูญ, ธุรกิจซื้อมาขายไป และงบการเงิน</p>
  <div class="progressbar"><div class="progressfill" id="pfill"></div></div>
</div>

<div class="wrap">
  <div class="scorepill">
    <span>คะแนนปัจจุบัน</span>
    <span><b id="scoreNow">0</b> / <span id="scoreTot">22</span></span>
  </div>
  <div id="quiz"></div>
  <div id="finalArea"></div>
  <div class="footer">ทำครบทุกข้อแล้วเลื่อนลงดูสรุปคะแนนด้านล่าง • เฉลยและคำอธิบายจะขึ้นทันทีที่เลือกคำตอบ</div>
</div>

<script>
const Q = [
{cat:"GJ • รายได้รับล่วงหน้า", q:"1 ธ.ค. บริษัท A รับเงินค่าเช่าล่วงหน้า 3 เดือน 9,000 บาท บันทึกด้วยวิธี 'หนี้สินหมุนเวียน' ณ วันรับเงินต้องบันทึกอย่างไร?",
o:["Dr. เงินสด 9,000 / Cr. รายได้ค่าเช่า 9,000","Dr. เงินสด 9,000 / Cr. รายได้ค่าเช่ารับล่วงหน้า 9,000","Dr. รายได้ค่าเช่ารับล่วงหน้า 9,000 / Cr. เงินสด 9,000","Dr. รายได้ค่าเช่ารับล่วงหน้า 9,000 / Cr. รายได้ค่าเช่า 9,000"],
a:1, ex:"วิธีที่ 1 (หนี้สินหมุนเวียน) เมื่อรับเงินล่วงหน้าให้บันทึกเป็นหนี้สินก่อน: Dr.เงินสด / Cr.รายได้รับล่วงหน้า เพราะยังไม่ได้ให้บริการ"},

{cat:"Adjusting • รายได้รับล่วงหน้า", q:"จากข้อก่อนหน้า ณ 31 ธ.ค. (ผ่านไป 1 เดือน) ต้องปรับปรุงบัญชีเท่าไร และบันทึกอย่างไร?",
o:["Dr. รายได้ค่าเช่ารับล่วงหน้า 3,000 / Cr. รายได้ค่าเช่า 3,000","Dr. รายได้ค่าเช่า 3,000 / Cr. รายได้ค่าเช่ารับล่วงหน้า 3,000","Dr. รายได้ค่าเช่ารับล่วงหน้า 9,000 / Cr. รายได้ค่าเช่า 9,000","Dr. เงินสด 3,000 / Cr. รายได้ค่าเช่า 3,000"],
a:0, ex:"9,000÷3 เดือน = 3,000 บาท/เดือน ที่ได้ให้บริการไปแล้วในเดือน ธ.ค. ต้องโอนจากหนี้สิน (รายได้รับล่วงหน้า) ไปเป็นรายได้: Dr.รายได้รับล่วงหน้า 3,000 / Cr.รายได้ค่าเช่า 3,000"},

{cat:"GJ • ค่าใช้จ่ายค้างจ่าย", q:"31 ธ.ค. กิจการค้างจ่ายเงินเดือนพนักงาน 1,950 บาท (ยังไม่จ่าย) ต้องบันทึกรายการปรับปรุงอย่างไร?",
o:["Dr. เงินเดือนจ่าย 1,950 / Cr. เงินสด 1,950","Dr. เงินเดือนค้างจ่าย 1,950 / Cr. เงินสด 1,950","Dr. เงินเดือนจ่าย 1,950 / Cr. เงินเดือนค้างจ่าย 1,950","Dr. เงินเดือนค้างจ่าย 1,950 / Cr. เงินเดือนจ่าย 1,950"],
a:2, ex:"ค่าใช้จ่ายเกิดขึ้นแล้วแต่ยังไม่จ่ายเงิน ต้องรับรู้ค่าใช้จ่ายพร้อมหนี้สิน: Dr.เงินเดือนจ่าย(ค่าใช้จ่าย) / Cr.เงินเดือนค้างจ่าย(หนี้สินหมุนเวียน)"},

{cat:"GJ • ดอกเบี้ยค้างจ่าย (Accrued Interest)", q:"On Nov 30, the company borrowed $4,000 on a 9% note payable, due in 3 months. ณ 31 ธ.ค. (Dec 31) ต้องปรับปรุง Interest Payable เท่าไร?",
o:["360 (4,000×9%)","30 (4,000×9%×1/12)","90 (4,000×9%×3/12)","10 (4,000×9%×1/36)"],
a:1, ex:"Interest accrued for 1 month only (Nov 30 – Dec 31): 4,000×9%×1/12 = 30 บันทึก Dr.Interest Expense 30 / Cr.Interest Payable 30"},

{cat:"GJ • รายได้ค้างรับ", q:"15 ธ.ค. กิจการเริ่มให้บริการซ่อมบำรุงลูกค้ารายหนึ่ง ค่าบริการเดือนละ 1,500 บาท จะเก็บเงินวันที่ 15 ของทุกเดือน ณ 31 ธ.ค. กิจการให้บริการไปแล้วครึ่งเดือน ต้องปรับปรุงอย่างไร?",
o:["Dr. เงินสด 750 / Cr. รายได้ค่าบริการ 750","Dr. ลูกหนี้การค้า 750 / Cr. รายได้ค่าบริการ 750","Dr. รายได้ค้างรับ 1,500 / Cr. รายได้ค่าบริการ 1,500","ไม่ต้องบันทึกเพราะยังไม่ได้รับเงิน"],
a:1, ex:"บริการไปแล้วครึ่งเดือน = 750 บาท แต่ยังไม่เก็บเงิน ต้องรับรู้รายได้ค้างรับ (เป็นสินทรัพย์หมุนเวียน): Dr.ลูกหนี้การค้า/รายได้ค้างรับ 750 / Cr.รายได้ค่าบริการ 750"},

{cat:"ค่าเผื่อหนี้สงสัยจะสูญ", q:"สิ้นเดือน ม.ค. บริษัทมีลูกหนี้การค้าคงเหลือ 11,000 บาท ผู้บริหารคาดว่า 30% จะเก็บไม่ได้ (ยังไม่เคยตั้งค่าเผื่อมาก่อน) ต้องบันทึกปรับปรุงอย่างไร?",
o:["Dr. หนี้สูญ 3,300 / Cr. ลูกหนี้การค้า 3,300","Dr. ขาดทุนจากการด้อยค่า-ลูกหนี้การค้า 3,300 / Cr. ค่าเผื่อการด้อยค่า-ลูกหนี้การค้า 3,300","Dr. ค่าเผื่อการด้อยค่า-ลูกหนี้การค้า 3,300 / Cr. ขาดทุนจากการด้อยค่า-ลูกหนี้การค้า 3,300","Dr. ลูกหนี้การค้า 3,300 / Cr. เงินสด 3,300"],
a:1, ex:"11,000×30% = 3,300 บาท เป็นยอดค่าเผื่อที่ต้องมี (ยอดแรก ไม่มีของเดิม): Dr.ขาดทุนจากการด้อยค่า(ค่าใช้จ่ายบริหาร) 3,300 / Cr.ค่าเผื่อการด้อยค่า(บัญชีปรับมูลค่า) 3,300"},

{cat:"ค่าเผื่อหนี้สงสัยจะสูญ", q:"สิ้นเดือน ก.พ. ลูกหนี้การค้าคงเหลือ 8,000 บาท ต้องการยอดค่าเผื่อฯ 30% = 2,400 บาท แต่ยอดค่าเผื่อฯ เดิม (ยกมา) มี 3,300 บาทอยู่แล้ว ต้องปรับปรุงอย่างไร?",
o:["Dr. ค่าเผื่อการด้อยค่าฯ 2,400 / Cr. ขาดทุนจากการด้อยค่าฯ 2,400","Dr. ขาดทุนจากการด้อยค่าฯ 900 / Cr. ค่าเผื่อการด้อยค่าฯ 900","Dr. ค่าเผื่อการด้อยค่าฯ 900 / Cr. ขาดทุนจากการด้อยค่าฯ 900","ไม่ต้องปรับปรุงเพราะยอดค่าเผื่อฯ มีอยู่แล้ว"],
a:2, ex:"ยอดที่ต้องการ (2,400) น้อยกว่ายอดเดิม (3,300) ต้องลดยอดค่าเผื่อฯ ลง 900 บาท (3,300-2,400): Dr.ค่าเผื่อการด้อยค่าฯ 900 / Cr.ขาดทุนจากการด้อยค่าฯ 900 (กลับรายการบางส่วน)"},

{cat:"ค่าเผื่อหนี้สงสัยจะสูญ • ตัดหนี้สูญ", q:"มี.ค. บริษัทเตี้ยติดดินฯ มีปัญหาการเงิน กิจการยอมลดหนี้ให้ 50% จากยอดลูกหนี้ 8,000 บาท และรับชำระเงินสด 4,000 บาททันที (มีค่าเผื่อฯ ยกมา 2,400 บาท) บันทึกอย่างไร?",
o:["Dr. เงินสด 4,000 / Cr. ลูกหนี้การค้า 4,000","Dr. เงินสด 4,000, ค่าเผื่อการด้อยค่าฯ 4,000 / Cr. ลูกหนี้การค้า 8,000","Dr. เงินสด 4,000, หนี้สูญ 4,000 / Cr. ลูกหนี้การค้า 8,000","Dr. เงินสด 4,000 / Cr. ค่าเผื่อการด้อยค่าฯ 4,000"],
a:1, ex:"ตัดลูกหนี้ออกทั้งจำนวน 8,000 โดยรับเงินสด 4,000 และส่วนที่เหลือ 4,000 ตัดจากบัญชีค่าเผื่อฯ ที่มีอยู่: Dr.เงินสด 4,000, Dr.ค่าเผื่อการด้อยค่าฯ 4,000 / Cr.ลูกหนี้การค้า 8,000"},

{cat:"ประเภทบัญชี", q:"ข้อใดจัดเป็น 'บัญชีชั่วคราว' (Temporary Accounts) ทั้งหมด?",
o:["เงินสด, ลูกหนี้การค้า, ที่ดิน","รายได้ค่าบริการ, ค่าใช้จ่ายเงินเดือน, เงินปันผล","เจ้าหนี้การค้า, ทุนหุ้นสามัญ, กำไรสะสม","สินค้าคงเหลือ, อุปกรณ์, ค่าเสื่อมราคาสะสม"],
a:1, ex:"บัญชีชั่วคราวคือหมวดรายได้ ค่าใช้จ่าย บัญชีสรุปยอดรายได้ค่าใช้จ่าย และเงินปันผล ซึ่งจะถูกปิดยอดเป็นศูนย์ทุกสิ้นงวด ส่วนตัวเลือกอื่นเป็นบัญชีถาวรทั้งหมด (อยู่ในงบแสดงฐานะการเงิน)"},

{cat:"การปิดบัญชี (Closing Entry)", q:"ขั้นตอนที่ 1 ของการปิดบัญชีกิจการให้บริการคืออะไร?",
o:["โอนปิดกำไร/ขาดทุนสุทธิจาก Income Summary ไปกำไรสะสม","โอนปิดบัญชีหมวดรายได้ไป Income Summary","โอนปิดเงินปันผลไปกำไรสะสม","โอนปิดบัญชีหมวดค่าใช้จ่ายไป Income Summary"],
a:1, ex:"ลำดับการปิดบัญชี: 1) ปิดรายได้→Income Summary 2) ปิดค่าใช้จ่าย→Income Summary 3) ปิด Income Summary→กำไรสะสม 4) ปิดเงินปันผล→กำไรสะสม"},

{cat:"การปิดบัญชี", q:"บริษัท Collins มีรายได้ค่าบริการรวม 17,260 บาท และค่าใช้จ่ายรวม 13,425 บาท การปิดบัญชีข้อที่ 3 (โอนปิด Income Summary ไปกำไรสะสม) ต้องบันทึกอย่างไร?",
o:["Dr. Income Summary 3,835 / Cr. กำไรสะสม 3,835","Dr. กำไรสะสม 3,835 / Cr. Income Summary 3,835","Dr. Income Summary 17,260 / Cr. กำไรสะสม 17,260","Dr. รายได้ค่าบริการ 3,835 / Cr. กำไรสะสม 3,835"],
a:0, ex:"กำไรสุทธิ = 17,260-13,425 = 3,835 บาท (Income Summary มียอดคงเหลือด้านเครดิต 3,835) เมื่อกำไรสุทธิ ต้องโอนปิดโดย Dr.Income Summary / Cr.กำไรสะสม 3,835"},

{cat:"การปิดบัญชี", q:"หากกิจการมีการจ่ายเงินปันผลระหว่างปี 800 บาท รายการปิดบัญชีข้อสุดท้ายต้องบันทึกอย่างไร?",
o:["Dr. เงินปันผลจ่าย 800 / Cr. เงินสด 800","Dr. กำไรสะสม 800 / Cr. เงินปันผลจ่าย 800","Dr. เงินปันผลจ่าย 800 / Cr. กำไรสะสม 800","Dr. Income Summary 800 / Cr. เงินปันผลจ่าย 800"],
a:1, ex:"เงินปันผลเป็นบัญชีชั่วคราวที่ไม่ผ่าน Income Summary แต่ปิดตรงไปกำไรสะสมเลย: Dr.กำไรสะสม 800 / Cr.เงินปันผลจ่าย 800"},

{cat:"งบทดลองหลังปิดบัญชี", q:"งบทดลองหลังปิดบัญชี (Post-Closing Trial Balance) จะประกอบด้วยบัญชีประเภทใด?",
o:["เฉพาะบัญชีหมวดรายได้และค่าใช้จ่าย","เฉพาะบัญชีถาวร (สินทรัพย์ หนี้สิน ทุน) เท่านั้น เพราะบัญชีชั่วคราวถูกปิดหมดแล้ว","บัญชีทุกหมวดเหมือนงบทดลองก่อนปรับปรุง","เฉพาะบัญชี Income Summary"],
a:1, ex:"หลังปิดบัญชีแล้ว บัญชีชั่วคราวทั้งหมด (รายได้ ค่าใช้จ่าย เงินปันผล Income Summary) มียอดเป็นศูนย์ จึงเหลือเฉพาะบัญชีถาวรที่แสดงในงบแสดงฐานะการเงิน"},

{cat:"การยกยอดคงเหลือ", q:"บัญชีประเภทใดที่โดยปกติมียอดคงเหลือด้านเครดิต (Cr.) เมื่อยกยอดไปงวดถัดไป?",
o:["บัญชีสินทรัพย์และขาดทุนสะสม","บัญชีหนี้สิน ทุน กำไรสะสม และค่าเผื่อการด้อยค่า","บัญชีค่าใช้จ่ายทุกประเภท","บัญชีเงินสดและลูกหนี้การค้า"],
a:1, ex:"บัญชีหนี้สิน ทุน กำไรสะสม รวมถึงบัญชีปรับมูลค่าสินทรัพย์ (ค่าเสื่อมราคาสะสม ค่าเผื่อการด้อยค่า) ปกติมียอดคงเหลือด้านเครดิต ส่วนสินทรัพย์มียอดคงเหลือด้านเดบิต"},

{cat:"COGS • ธุรกิจซื้อมาขายไป", q:"Beginning Inventory = 20,000, Purchases (net) = 150,000, Ending Inventory = 35,000. Cost of Goods Sold (COGS) เท่ากับเท่าไร?",
o:["130,000","135,000","150,000","165,000"],
a:1, ex:"COGS = Beginning Inventory + Net Purchases − Ending Inventory = 20,000+150,000-35,000 = 135,000"},

{cat:"COGS • ซื้อสุทธิ (Net Purchases)", q:"Purchases = 100,000, Purchase Returns = 5,000, Purchase Discounts = 2,000, Freight-in = 3,000. Net Purchases เท่ากับเท่าไร?",
o:["100,000","93,000","96,000","98,000"],
a:2, ex:"Net Purchases = Purchases − Returns − Discounts + Freight-in = 100,000-5,000-2,000+3,000 = 96,000"},

{cat:"งบกำไรขาดทุน • Gross Profit", q:"Sales = 500,000, Sales Returns = 10,000, COGS = 280,000. Gross Profit เท่ากับเท่าไร?",
o:["220,000","210,000","230,000","200,000"],
a:1, ex:"Net Sales = 500,000-10,000 = 490,000; Gross Profit = Net Sales − COGS = 490,000-280,000 = 210,000"},

{cat:"งบกำไรขาดทุน • Net Income", q:"จากข้อก่อนหน้า (Gross Profit = 210,000) หากมี Operating Expenses รวม 120,000 บาท Net Income before tax เท่ากับเท่าไร?",
o:["90,000","100,000","110,000","80,000"],
a:0, ex:"Net Income = Gross Profit − Operating Expenses = 210,000-120,000 = 90,000"},

{cat:"General Ledger • Cash account", q:"Cash account: Beginning balance (Dr.) = 5,000, total Debits during the period = 40,200, total Credits = 38,350. Ending balance เท่ากับเท่าไรและอยู่ด้านใด?",
o:["6,850 — Debit","1,850 — Credit","45,200 — Debit","6,850 — Credit"],
a:0, ex:"Ending balance = Beginning + Debits − Credits = 5,000+40,200-38,350 = 6,850 เงินสดเป็นสินทรัพย์ (Asset) จึงมียอดคงเหลือปกติด้าน Debit"},

{cat:"ลักษณะรายการปรับปรุง", q:"ข้อใดกล่าวถูกต้องเกี่ยวกับ 'รายการปรับปรุง' (Adjusting Entries)?",
o:["ทุกรายการปรับปรุงจะกระทบเฉพาะบัญชีในงบแสดงฐานะการเงินเท่านั้น","ทุกรายการปรับปรุงจะกระทบบัญชีในงบกำไรขาดทุน 1 บัญชี และบัญชีในงบแสดงฐานะการเงิน 1 บัญชีเสมอ","รายการปรับปรุงไม่เกี่ยวข้องกับเงินสด และไม่กระทบกำไรสุทธิ","รายการปรับปรุงทำได้เฉพาะวันสิ้นปีเท่านั้น"],
a:1, ex:"ลักษณะสำคัญของรายการปรับปรุงคือ ทุกรายการจะรับรู้รายได้หรือค่าใช้จ่าย (งบกำไรขาดทุน) พร้อมกับการเปลี่ยนแปลงสินทรัพย์หรือหนี้สิน (งบแสดงฐานะการเงิน) เสมอ"},

{cat:"วิธีบันทึกรายได้รับล่วงหน้า (วิธีที่ 2)", q:"หากกิจการเลือกบันทึกเงินที่ได้รับล่วงหน้าเป็น 'รายได้' ทันที (วิธีที่ 2) ณ วันสิ้นงวดต้องปรับปรุงอย่างไร หากยังมีส่วนที่ยังไม่ได้ให้บริการ?",
o:["Dr. รายได้รับล่วงหน้า / Cr. รายได้","Dr. รายได้ / Cr. รายได้รับล่วงหน้า","ไม่ต้องปรับปรุงเพราะบันทึกเป็นรายได้ไปแล้ว","Dr. เงินสด / Cr. รายได้รับล่วงหน้า"],
a:1, ex:"วิธีที่ 2 บันทึกรับเงินเป็นรายได้ทันที ดังนั้นสิ้นงวดต้องปรับปรุงลดรายได้ส่วนที่ยังไม่เกิดขึ้นจริงออก แล้วโอนไปเป็นหนี้สิน: Dr.รายได้ / Cr.รายได้รับล่วงหน้า"},

{cat:"สรุปภาพรวม", q:"กิจการซื้อมาขายไปแห่งหนึ่งมี: ขาย 800,000, สินค้าต้นงวด 50,000, ซื้อสุทธิ 400,000, สินค้าปลายงวด 60,000, ค่าใช้จ่ายดำเนินงาน 150,000, ขาดทุนจากการด้อยค่าลูกหนี้ 5,000 กำไรสุทธิเท่ากับเท่าไร?",
o:["255,000 บาท","265,000 บาท","245,000 บาท","390,000 บาท"],
a:0, ex:"COGS = 50,000+400,000-60,000 = 390,000; กำไรขั้นต้น = 800,000-390,000 = 410,000; กำไรสุทธิ = 410,000-150,000-5,000 = 255,000 บาท"},

{cat:"สรุปภาพรวม • Closing", q:"หลังคำนวณกำไรสุทธิ 255,000 บาทข้างต้นแล้ว รายการปิดบัญชีข้อที่ 3 ต้องบันทึกโอนยอดนี้ไปที่บัญชีใด และด้านใด?",
o:["Dr. กำไรสะสม / Cr. Income Summary","Dr. Income Summary / Cr. กำไรสะสม","Dr. เงินปันผลจ่าย / Cr. กำไรสะสม","Dr. รายได้ / Cr. กำไรสะสม"],
a:1, ex:"เมื่อกิจการมีกำไรสุทธิ (Income Summary ด้านเครดิตมากกว่า) ต้องโอนปิดกำไรสุทธิเข้าบัญชีกำไรสะสม: Dr.Income Summary / Cr.กำไรสะสม 255,000"},

{cat:"หลักการบันทึกบัญชีคู่", q:"ตามหลักบัญชีคู่ (Double-entry) เมื่อสินทรัพย์ 'เพิ่มขึ้น' ปกติจะบันทึกไว้ด้านใด และหนี้สิน 'เพิ่มขึ้น' บันทึกด้านใด?",
o:["สินทรัพย์เพิ่ม=เครดิต, หนี้สินเพิ่ม=เดบิต","สินทรัพย์เพิ่ม=เดบิต, หนี้สินเพิ่ม=เครดิต","ทั้งสองเพิ่มขึ้นบันทึกด้านเดบิตเหมือนกัน","ทั้งสองเพิ่มขึ้นบันทึกด้านเครดิตเหมือนกัน"],
a:1, ex:"สินทรัพย์อยู่ฝั่งซ้ายสมการบัญชี เพิ่มขึ้น=เดบิต ลดลง=เครดิต ส่วนหนี้สินและทุนอยู่ฝั่งขวา เพิ่มขึ้น=เครดิต ลดลง=เดบิต"},

{cat:"GJ • ซื้อสินค้าเป็นเงินเชื่อ", q:"กิจการซื้อสินค้า (ระบบ Periodic) มูลค่า 25,000 บาทเป็นเงินเชื่อจากผู้ขาย ต้องบันทึกอย่างไร?",
o:["Dr. สินค้าคงเหลือ 25,000 / Cr. เจ้าหนี้การค้า 25,000","Dr. ซื้อสินค้า 25,000 / Cr. เจ้าหนี้การค้า 25,000","Dr. เจ้าหนี้การค้า 25,000 / Cr. ซื้อสินค้า 25,000","Dr. ซื้อสินค้า 25,000 / Cr. เงินสด 25,000"],
a:1, ex:"ระบบ Periodic ใช้บัญชี 'ซื้อสินค้า' (Purchases) บันทึกแทนการปรับสินค้าคงเหลือโดยตรง เพราะยังไม่นับสต๊อกจนสิ้นงวด: Dr.ซื้อสินค้า / Cr.เจ้าหนี้การค้า"},

{cat:"GJ • ขายสินค้าเป็นเงินเชื่อ", q:"กิจการขายสินค้าเป็นเงินเชื่อ 40,000 บาท (ยังไม่รวมต้นทุนขาย เพราะเป็นระบบ Periodic) ต้องบันทึกรายการขายอย่างไร?",
o:["Dr. ลูกหนี้การค้า 40,000 / Cr. ขายสินค้า 40,000","Dr. ขายสินค้า 40,000 / Cr. ลูกหนี้การค้า 40,000","Dr. เงินสด 40,000 / Cr. ขายสินค้า 40,000","Dr. ลูกหนี้การค้า 40,000 / Cr. สินค้าคงเหลือ 40,000"],
a:0, ex:"ระบบ Periodic บันทึกเฉพาะด้านรายได้จากการขาย ไม่บันทึกต้นทุนขายและลดสินค้าคงเหลือทันที (จะคำนวณ COGS รวมตอนสิ้นงวด): Dr.ลูกหนี้การค้า / Cr.ขายสินค้า"},

{cat:"GJ • ส่วนลดการค้า/รับคืนสินค้า", q:"ลูกค้าส่งคืนสินค้าที่เคยขายเป็นเงินเชื่อไป มูลค่า 3,000 บาท กิจการต้องบันทึกอย่างไร (ระบบ Periodic)?",
o:["Dr. รับคืนสินค้าและส่วนลด 3,000 / Cr. ลูกหนี้การค้า 3,000","Dr. ลูกหนี้การค้า 3,000 / Cr. รับคืนสินค้าและส่วนลด 3,000","Dr. ขายสินค้า 3,000 / Cr. ลูกหนี้การค้า 3,000","Dr. สินค้าคงเหลือ 3,000 / Cr. ลูกหนี้การค้า 3,000"],
a:0, ex:"รับคืนสินค้า (Sales Returns and Allowances) เป็นบัญชีปรับลดรายได้ บันทึก Dr.รับคืนสินค้าและส่วนลด / Cr.ลูกหนี้การค้า เพื่อลดยอดหนี้ที่ลูกค้าต้องชำระ"},

{cat:"งบแสดงฐานะการเงิน", q:"ข้อใดจัดอยู่ในหมวด 'สินทรัพย์หมุนเวียน' (Current Assets) ทั้งหมด?",
o:["ที่ดิน อาคาร อุปกรณ์","เงินสด ลูกหนี้การค้า สินค้าคงเหลือ","ทุนหุ้นสามัญ กำไรสะสม","เจ้าหนี้การค้า เงินกู้ระยะยาว"],
a:1, ex:"สินทรัพย์หมุนเวียนคือสินทรัพย์ที่คาดว่าจะเปลี่ยนเป็นเงินสดหรือใช้หมดภายใน 1 ปี ได้แก่ เงินสด ลูกหนี้การค้า สินค้าคงเหลือ ค่าใช้จ่ายจ่ายล่วงหน้า ส่วนที่ดินอาคารอุปกรณ์เป็นสินทรัพย์ไม่หมุนเวียน"},

{cat:"งบแสดงฐานะการเงิน", q:"'หนี้สินหมุนเวียน' (Current Liabilities) แตกต่างจากหนี้สินไม่หมุนเวียนอย่างไร?",
o:["หนี้สินหมุนเวียนคือหนี้ที่ต้องชำระภายใน 1 ปี ส่วนไม่หมุนเวียนคือเกิน 1 ปี","หนี้สินหมุนเวียนคือหนี้ที่ไม่มีดอกเบี้ย","หนี้สินหมุนเวียนใช้เฉพาะกับเจ้าหนี้การค้าเท่านั้น","ไม่มีความแตกต่าง ใช้แทนกันได้"],
a:0, ex:"เกณฑ์การจัดประเภทคือระยะเวลาครบกำหนดชำระ: ภายใน 1 ปี = หมุนเวียน (เจ้าหนี้การค้า, เงินเดือนค้างจ่าย, รายได้รับล่วงหน้า) เกิน 1 ปี = ไม่หมุนเวียน (เงินกู้ระยะยาว)"},

{cat:"สมการบัญชี • Accounting Equation", q:"Total Assets = 500,000, Total Liabilities = 180,000. Owner's Equity เท่ากับเท่าไร?",
o:["680,000","320,000","500,000","180,000"],
a:1, ex:"Accounting Equation: Assets = Liabilities + Owner's Equity ดังนั้น Equity = 500,000-180,000 = 320,000"},

{cat:"งบกำไรขาดทุนเบ็ดเสร็จ", q:"ข้อใดเรียงลำดับโครงสร้างงบกำไรขาดทุน (ธุรกิจซื้อมาขายไป) ได้ถูกต้อง?",
o:["ขายสุทธิ → กำไรขั้นต้น → ต้นทุนขาย → กำไรสุทธิ","ขายสุทธิ → ต้นทุนขาย → กำไรขั้นต้น → ค่าใช้จ่ายดำเนินงาน → กำไรสุทธิ","ต้นทุนขาย → ขายสุทธิ → ค่าใช้จ่ายดำเนินงาน → กำไรขั้นต้น","กำไรสุทธิ → กำไรขั้นต้น → ขายสุทธิ → ต้นทุนขาย"],
a:1, ex:"โครงสร้างที่ถูกต้อง: ขายสุทธิ (หัก) ต้นทุนขาย = กำไรขั้นต้น (หัก) ค่าใช้จ่ายในการขายและบริหาร = กำไรสุทธิ"},

{cat:"GJ • ค่าเสื่อมราคา (Depreciation)", q:"Building cost = $36,000, straight-line depreciation over 240 months. ณ สิ้นเดือนต้องบันทึก Depreciation Expense เท่าไร และบันทึกอย่างไร?",
o:["150: Dr. Depreciation Expense-Building 150 / Cr. Accumulated Depreciation-Building 150","150: Dr. Accumulated Depreciation-Building 150 / Cr. Depreciation Expense-Building 150","36,000: Dr. Depreciation Expense-Building 36,000 / Cr. Building 36,000","150: Dr. Depreciation Expense-Building 150 / Cr. Building 150"],
a:0, ex:"Monthly depreciation = 36,000÷240 = 150 รับรู้ค่าใช้จ่ายพร้อมบัญชีปรับมูลค่า (ไม่หักออกจาก Building โดยตรง): Dr.Depreciation Expense / Cr.Accumulated Depreciation"},

{cat:"บัญชีปรับมูลค่าสินทรัพย์", q:"'ค่าเสื่อมราคาสะสม' (Accumulated Depreciation) แสดงอยู่ในงบการเงินอย่างไร?",
o:["เป็นค่าใช้จ่ายในงบกำไรขาดทุน","เป็นบัญชีปรับมูลค่าหักจากสินทรัพย์ในงบแสดงฐานะการเงิน มียอดคงเหลือด้านเครดิต","เป็นหนี้สินหมุนเวียน","เป็นส่วนหนึ่งของทุน"],
a:1, ex:"ค่าเสื่อมราคาสะสมเป็นบัญชีปรับมูลค่า (Contra-Asset) นำไปหักจากราคาทุนของสินทรัพย์ถาวรในงบแสดงฐานะการเงิน เพื่อแสดงมูลค่าตามบัญชีสุทธิ และมียอดคงเหลือด้านเครดิตเหมือนบัญชีหนี้สิน"},

{cat:"สรุปภาพรวม • ค้างจ่าย/ค้างรับ", q:"กิจการค้างรับดอกเบี้ย 200 บาท และค้างจ่ายค่าเช่า 500 บาท ณ สิ้นงวด ผลรวมของรายการปรับปรุงทั้งสองนี้กระทบกำไรสุทธิสุทธิเท่าไร (เพิ่มขึ้น/ลดลง)?",
o:["กำไรสุทธิลดลง 300 บาท","กำไรสุทธิเพิ่มขึ้น 300 บาท","กำไรสุทธิลดลง 700 บาท","ไม่กระทบกำไรสุทธิ"],
a:0, ex:"ดอกเบี้ยค้างรับ +200 (รายได้เพิ่ม) และค่าเช่าค้างจ่าย -500 (ค่าใช้จ่ายเพิ่ม) สุทธิ = 200-500 = -300 บาท กำไรสุทธิลดลง 300 บาท"},

{cat:"งบทดลอง", q:"หากงบทดลอง (Trial Balance) มียอดเดบิตรวมไม่เท่ากับยอดเครดิตรวม แสดงว่าอะไร?",
o:["กิจการมีกำไรสุทธิ","กิจการขาดทุนสุทธิ","มีข้อผิดพลาดในการบันทึกหรือผ่านรายการบัญชี ต้องตรวจสอบแก้ไข","เป็นเรื่องปกติ ไม่ต้องแก้ไข"],

];

let idx=0, score=0, answered=new Array(Q.length).fill(false);
const quizEl=document.getElementById('quiz');
const scoreNowEl=document.getElementById('scoreNow');
const scoreTotEl=document.getElementById('scoreTot');
const pfill=document.getElementById('pfill');
scoreTotEl.textContent=Q.length;

function render(){
  quizEl.innerHTML='';
  Q.forEach((item,i)=>{
    const card=document.createElement('div');
    card.className='qcard';
    card.id='card'+i;
    card.innerHTML=`
      <div class="qmeta"><span class="tag">ข้อ ${i+1}/${Q.length}</span><span class="tag gold">${item.cat}</span></div>
      <div class="qtext">${item.q}</div>
      <div class="opts" id="opts${i}"></div>
      <div class="result-badge" id="badge${i}"></div>
      <div class="explain" id="ex${i}"><b>คำอธิบาย:</b> ${item.ex}</div>
    `;
    quizEl.appendChild(card);
    const optsWrap=card.querySelector('#opts'+i);
    item.o.forEach((optText,oi)=>{
      const btn=document.createElement('button');
      btn.className='opt';
      btn.textContent=String.fromCharCode(65+oi)+'. '+optText;
      btn.onclick=()=>select(i,oi);
      optsWrap.appendChild(btn);
    });
  });
  renderFinal();
}

function select(qi,oi){
  if(answered[qi]) return;
  answered[qi]=true;
  const item=Q[qi];
  const buttons=document.querySelectorAll('#opts'+qi+' .opt');
  buttons.forEach((b,bi)=>{
    b.classList.add('disabled');
    if(bi===item.a) b.classList.add('correct');
    else if(bi===oi) b.classList.add('wrong');
    else b.classList.add('faded');
  });
  document.getElementById('ex'+qi).classList.add('show');
  const badge=document.getElementById('badge'+qi);
  if(oi===item.a){ score++; badge.textContent='✓ ถูกต้อง'; badge.className='result-badge ok'; }
  else { badge.textContent='✗ ไม่ถูกต้อง — เฉลยคือข้อ '+String.fromCharCode(65+item.a); badge.className='result-badge no'; }
  scoreNowEl.textContent=score;
  const doneCount=answered.filter(Boolean).length;
  pfill.style.width=(doneCount/Q.length*100)+'%';
  renderFinal();
}

function renderFinal(){
  const finalArea=document.getElementById('finalArea');
  const doneCount=answered.filter(Boolean).length;
  if(doneCount<Q.length){ finalArea.innerHTML=''; return; }
  const pct=Math.round(score/Q.length*100);
  let msg = pct>=80?'ยอดเยี่ยม พร้อมสอบมิดเทอมแล้ว!' : pct>=60?'ใช้ได้ ทบทวนจุดที่พลาดอีกนิด' : 'ควรทบทวนเนื้อหาเพิ่มเติมก่อนสอบ';
  finalArea.innerHTML=`
    <div class="finalbox">
      <div class="big">${score} / ${Q.length}</div>
      <p>คิดเป็น ${pct}% — ${msg}</p>
      <button class="act" onclick="resetQuiz()">ทำแบบทดสอบใหม่</button>
    </div>`;
}

function resetQuiz(){
  idx=0; score=0; answered=new Array(Q.length).fill(false);
  scoreNowEl.textContent=0; pfill.style.width='0%';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

render();
</script>
